packages:
  - apps/*
  - shared/*
  - libs/*
allowBuilds:
  "@prisma/engines": true
  prisma: true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  workerd: true
  '@scarf/scarf': true
minimumReleaseAgeExclude:
  - "@nestjs/core@12.5.1"
  - "@nestjs/common@12.5.1"
  - "@nestjs/terminus@12.2.0"
  - "@nestjs/platform-express@12.5.1"
  - "@tanstack/query-core@5.108.4"
  - "@tanstack/react-query@5.108.4"
