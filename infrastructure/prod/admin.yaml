apiVersion: v1
kind: Service
metadata:
  name: planee-admin-svc
  namespace: planee
  labels:
    app: planee-admin
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: planee-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planee-admin
  namespace: planee
  labels:
    app: planee-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planee-admin
  template:
    metadata:
      labels:
        app: planee-admin
    spec:
      serviceAccountName: planee-app-sa
      initContainers:
        - name: wait-for-migration
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for database migration job to complete..."
              kubectl wait --namespace=planee --for=condition=complete --timeout=300s job/planee-db-migrate
      containers:
        - name: admin
          image: registry.cloud.martinpetr.dev/planee/admin:sha-c9caa53
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: planee-config
          env:
            - name: PORT
              value: "3000"
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONF_ADMIN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: planee-admin-oidc
                  key: CONF_ADMIN_OIDC_CLIENT_SECRET
            - name: CONF_ADMIN_OIDC_COOKIE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: planee-admin-oidc
                  key: CONF_ADMIN_OIDC_COOKIE_ENCRYPTION_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: planee-admin-ingress
  namespace: planee
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`admin.planee.martinpetr.dev`)
      kind: Rule
      services:
        - name: planee-admin-svc
          port: 80
  tls:
    certResolver: cloudflare
