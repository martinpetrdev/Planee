apiVersion: batch/v1
kind: Job
metadata:
  name: planee-db-migrate
  namespace: planee
  labels:
    app: planee-db-migrate
  annotations:
    # Job spec is immutable: let Flux delete + recreate it when the image tag changes
    # Added by Claude Opus 5
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: planee-db-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: registry.cloud.martinpetr.dev/planee/db-migration:sha-e06d268
          envFrom:
            - configMapRef:
                name: planee-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: planee-postgres-cluster-app # CNPG generated
                  key: uri
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
