apiVersion: v1
kind: Service
metadata:
  name: planee-redis-svc
  namespace: planee
  labels:
    app: planee-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: planee-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planee-redis
  namespace: planee
  labels:
    app: planee-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: planee-redis
  template:
    metadata:
      labels:
        app: planee-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planee-redis
                  key: password
            - name: REDISCLI_AUTH # Used by redis-cli in probes
              valueFrom:
                secretKeyRef:
                  name: planee-redis
                  key: password
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
