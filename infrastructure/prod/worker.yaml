apiVersion: v1
kind: Service
metadata:
  name: planee-worker-svc
  namespace: planee
  labels:
    app: planee-worker
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: planee-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planee-worker
  namespace: planee
  labels:
    app: planee-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planee-worker
  template:
    metadata:
      labels:
        app: planee-worker
    spec:
      serviceAccountName: planee-app-sa
      initContainers:
        - name: wait-for-migration
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for database migration job to complete..."
              kubectl wait --namespace=planee --for=condition=complete --timeout=300s job/planee-db-migrate
      containers:
        - name: worker
          image: registry.cloud.martinpetr.dev/planee/worker:sha-7896048
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: planee-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: planee-postgres-cluster-app # CNPG generated
                  key: uri
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planee-redis
                  key: password
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@planee-redis-svc:6379
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
